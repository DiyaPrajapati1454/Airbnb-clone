<div class="booking-card">

  <div class="booking-header">
    <h2>Request a Tour</h2>
    <p>Choose a convenient date and time to visit this property.</p>
  </div>

  <form (ngSubmit)="submitRequest()" #tourForm="ngForm">

    <div class="form-group">
      <label for="name">Full Name</label>

      <input
        id="name"
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Enter your name"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>

      <input
        id="phone"
        type="tel"
        name="phone"
        [(ngModel)]="phone"
        placeholder="Enter your phone number"
        required
      />
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="date">Date</label>

        <input
          id="date"
          type="date"
          name="date"
          [(ngModel)]="date"
          required
        />
      </div>

      <div class="form-group">
        <label for="time">Time</label>

        <input
          id="time"
          type="time"
          name="time"
          [(ngModel)]="time"
          required
        />
      </div>

    </div>

    <button
      type="submit"
      [disabled]="tourForm.invalid"
    >
      Request Tour
    </button>

  </form>

  @if (submitted) {
    <div class="success-message">
      Your tour request has been submitted successfully.
    </div>
  }

</div>
